<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Mini Games</title>
    <!-- ゲームと同じ配色・文字・ボタンを使う -->
    <link rel="stylesheet" href="common/common.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <h1>JS Mini Games</h1>
        <p class="site-lead">JavaScriptの主要な考え方を、短いゲームを作りながら学ぶ教材</p>
        <p class="site-note">フレームワークやビルドツールは使いません。ブラウザとテキストエディタだけで動きます。</p>
        <a class="btn" href="https://github.com/sakamoto-08/js-mini-games" target="_blank" rel="noopener noreferrer">GitHubで見る</a>
      </header>

      <!-- カードは script.js が games 配列から作る -->
      <main>
        <div id="game-list" class="game-grid"></div>
      </main>

      <footer class="site-footer">
        <p>このリポジトリはJavaScript学習用の教材です。</p>
        <p><a href="https://github.com/sakamoto-08/js-mini-games" target="_blank" rel="noopener noreferrer">GitHub</a></p>
        <p>フレームワーク・ビルドツール不使用</p>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
