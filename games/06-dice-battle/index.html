<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>サイコロ勝負 | JS Mini Games</title>
    <!-- 共通スタイル → このゲームだけのスタイル、の順で読み込む -->
    <link rel="stylesheet" href="../../common/common.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <p class="game-kicker">06 / Dice Battle</p>
      <h1>サイコロ勝負</h1>
      <p class="game-lead">
        サイコロを振って勝負します。<br />
        出目が大きい方が勝ちです。
      </p>

      <!-- 勝ち・負け・あいこは script.js が common.js で作る -->
      <div id="score-area"></div>

      <div class="dice-row">
        <div class="dice-side">
          <span class="dice-label">あなた</span>
          <!-- 中の点は script.js が作る -->
          <div id="player-die" class="die" aria-label="未定"></div>
          <p id="player-value" class="die-value">—</p>
        </div>
        <span class="dice-vs">vs</span>
        <div class="dice-side">
          <span class="dice-label">コンピュータ</span>
          <div id="computer-die" class="die" aria-label="未定"></div>
          <p id="computer-value" class="die-value">—</p>
        </div>
      </div>

      <button type="button" id="roll-button" class="btn roll-button">サイコロを振る</button>

      <p id="message" class="message" hidden aria-live="polite"></p>

      <!-- 「リセット」ボタンは script.js が作る -->
      <div id="restart-area"></div>
    </main>

    <!-- common.js を先に読み、そのあとでゲーム本体を読む -->
    <script src="../../common/common.js"></script>
    <script src="script.js"></script>
  </body>
</html>
