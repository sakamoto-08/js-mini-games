<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>じゃんけん | JS Mini Games</title>
    <!-- 共通スタイル → このゲームだけのスタイル、の順で読み込む -->
    <link rel="stylesheet" href="../../common/common.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <p class="game-kicker">02 / Janken</p>
      <h1>じゃんけん</h1>
      <p class="game-lead">
        グー、チョキ、パーから1つ選んでください。<br />
        コンピュータと勝敗を決めます。
      </p>

      <!-- 勝ち・負け・あいこの表示は script.js が common.js で作る -->
      <div id="score-area"></div>

      <p class="hand-caption">あなたの手</p>
      <!-- 中の3ボタンは、手の配列から script.js が作る -->
      <div id="hand-list" class="hand-list"></div>

      <div id="result-board" class="result-board" hidden>
        <div class="result-side">
          <span class="result-label">あなた</span>
          <strong id="player-hand" class="result-hand"></strong>
        </div>
        <span class="result-vs">vs</span>
        <div class="result-side">
          <span class="result-label">コンピュータ</span>
          <strong id="computer-hand" class="result-hand"></strong>
        </div>
      </div>

      <p id="message" class="message" hidden aria-live="polite"></p>

      <!-- 「リセット」ボタンは script.js が作る -->
      <div id="restart-area"></div>
    </main>

    <!-- common.js を先に読み、そのあとでゲーム本体を読む -->
    <script src="../../common/common.js"></script>
    <script src="script.js"></script>
  </body>
</html>
