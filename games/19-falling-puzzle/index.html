<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>落ちものパズル | JS Mini Games</title>
    <!-- 共通スタイル → このゲームだけのスタイル、の順で読み込む -->
    <link rel="stylesheet" href="../../common/common.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <p class="game-kicker">19 / Falling Puzzle</p>
      <h1>落ちものパズル</h1>
      <p class="game-lead">
        左右キーで動かし、下キーで速く落とします。<br />
        スペースか上キーで回して、横一列を揃えます。
      </p>

      <!-- ライン、スコア、最高記録は script.js が common.js で作る -->
      <div id="score-area"></div>

      <div class="board-wrap">
        <!-- 幅と高さの本当の値は script.js がマスの数から入れます -->
        <canvas id="board" width="200" height="360" aria-label="落ちものパズルの盤面"></canvas>
      </div>

      <p id="message" class="message" hidden aria-live="polite"></p>

      <!-- 「もう一度」ボタンは script.js が作る -->
      <div id="restart-area" hidden></div>
    </main>

    <!-- common.js を先に読み、そのあとでゲーム本体を読む -->
    <script src="../../common/common.js"></script>
    <script src="script.js"></script>
  </body>
</html>
