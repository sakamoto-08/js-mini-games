<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>反応速度 | JS Mini Games</title>
    <!-- 共通スタイル → このゲームだけのスタイル、の順で読み込む -->
    <link rel="stylesheet" href="../../common/common.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="game-shell" class="game-shell">
      <p class="game-kicker">04 / Reaction Time</p>
      <h1>反応速度</h1>
      <p class="game-lead">
        スタート後、色が変わるまで待ちます。<br />
        変わったらすぐにクリックしてください。
      </p>

      <!-- 今回の記録と最高記録は script.js が common.js で作る -->
      <div id="score-area"></div>

      <button type="button" id="target-button" class="btn target-button" disabled>
        スタートを押す
      </button>
      <button type="button" id="start-button" class="btn start-button">スタート</button>

      <p id="message" class="message" hidden aria-live="polite"></p>

      <!-- 「もう一度」ボタンは script.js が作る -->
      <div id="restart-area" hidden></div>
    </main>

    <!-- common.js を先に読み、そのあとでゲーム本体を読む -->
    <script src="../../common/common.js"></script>
    <script src="script.js"></script>
  </body>
</html>
