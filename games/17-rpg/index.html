<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>簡易RPG | JS Mini Games</title>
    <!-- 共通スタイル → このゲームだけのスタイル、の順で読み込む -->
    <link rel="stylesheet" href="../../common/common.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <p class="game-kicker">17 / RPG</p>
      <h1>簡易RPG</h1>
      <p class="game-lead">
        選択肢を選んで、祠を目指します。<br />
        HPが0になるとゲームオーバーです。
      </p>

      <!-- HP・所持金・持ち物・敵HPは script.js が common.js で作る -->
      <div id="score-area"></div>

      <p id="story" class="story" aria-live="polite"></p>
      <div id="choices" class="choices"></div>

      <p id="message" class="message" hidden aria-live="polite"></p>

      <!-- 「もう一度」ボタンは script.js が作る -->
      <div id="restart-area" hidden></div>
    </main>

    <!-- common.js を先に読み、そのあとでゲーム本体を読む -->
    <script src="../../common/common.js"></script>
    <script src="script.js"></script>
  </body>
</html>
