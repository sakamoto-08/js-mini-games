<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>クリックカウンター | JS Mini Games</title>
    <!-- 共通スタイル → このゲームだけのスタイル、の順で読み込む -->
    <link rel="stylesheet" href="../../common/common.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <p class="game-kicker">03 / Click Counter</p>
      <h1>クリックカウンター</h1>
      <p class="game-lead">
        スタートを押すと、10秒間はじまります。<br />
        大きなボタンを連打してください。
      </p>

      <!-- クリック数と残り時間は script.js が common.js で作る -->
      <div id="score-area"></div>
      <!-- 最高記録。ページを再読み込みするまで残す -->
      <div id="record-area"></div>

      <button type="button" id="click-button" class="btn click-button" disabled>
        クリック！
      </button>
      <button type="button" id="start-button" class="btn start-button">スタート</button>

      <p id="message" class="message" hidden aria-live="polite"></p>

      <!-- 「もう一度」ボタンは script.js が作る -->
      <div id="restart-area" hidden></div>
    </main>

    <!-- common.js を先に読み、そのあとでゲーム本体を読む -->
    <script src="../../common/common.js"></script>
    <script src="script.js"></script>
  </body>
</html>
