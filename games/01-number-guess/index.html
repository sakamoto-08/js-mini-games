<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数当てゲーム | JS Mini Games</title>
    <!-- 共通スタイル → このゲームだけのスタイル、の順で読み込む -->
    <link rel="stylesheet" href="../../common/common.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <p class="game-kicker">01 / Number Guess</p>
      <h1>数当てゲーム</h1>
      <p class="game-lead">
        1〜100 の数字を当ててください。ヒントを手がかりに、少ない回数を目指します。
      </p>

      <!-- 試行回数の表示は script.js が common.js で作る -->
      <div id="score-area"></div>

      <form id="guess-form" class="guess-form">
        <label for="guess-input">あなたの予想</label>
        <div class="guess-row">
          <input
            id="guess-input"
            type="number"
            min="1"
            max="100"
            inputmode="numeric"
            required
            autofocus
          />
          <button type="submit" class="btn">答える</button>
        </div>
      </form>

      <!-- ヒントと正解メッセージ。最初は空 -->
      <p id="message" class="message" hidden aria-live="polite"></p>

      <!-- 正解したときだけ表示する。中のボタンは script.js が作る -->
      <div id="restart-area" hidden></div>
    </main>

    <!-- common.js を先に読み、そのあとでゲーム本体を読む -->
    <script src="../../common/common.js"></script>
    <script src="script.js"></script>
  </body>
</html>
