<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>キャッチゲーム | JS Mini Games</title>
    <!-- 共通スタイル → このゲームだけのスタイル、の順で読み込む -->
    <link rel="stylesheet" href="../../common/common.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <p class="game-kicker">18 / Catch</p>
      <h1>キャッチゲーム</h1>
      <p class="game-lead">
        左右キーかマウスでバーを動かします。<br />
        金の丸を取ると得点、赤い四角はライフが減ります。
      </p>

      <!-- スコア、最高記録、ライフ、残り時間は script.js が common.js で作る -->
      <div id="score-area"></div>

      <div class="board-wrap">
        <!-- 幅と高さの本当の値は script.js が定数から入れます -->
        <canvas id="board" width="280" height="360" aria-label="キャッチゲームの盤面"></canvas>
      </div>

      <p id="message" class="message" hidden aria-live="polite"></p>

      <!-- 「もう一度」ボタンは script.js が作る -->
      <div id="restart-area" hidden></div>
    </main>

    <!-- common.js を先に読み、そのあとでゲーム本体を読む -->
    <script src="../../common/common.js"></script>
    <script src="script.js"></script>
  </body>
</html>
