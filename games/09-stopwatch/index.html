<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ストップウォッチ | JS Mini Games</title>
    <!-- 共通スタイル → このゲームだけのスタイル、の順で読み込む -->
    <link rel="stylesheet" href="../../common/common.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <p class="game-kicker">09 / Stopwatch</p>
      <h1>ストップウォッチ</h1>
      <p class="game-lead">
        スタートで測り、ストップで止めます。<br />
        ラップで途中の時間を残せます。
      </p>

      <p id="time" class="time">00:00.00</p>

      <!-- ラップ数は script.js が common.js で作る -->
      <div id="score-area"></div>

      <div class="controls">
        <button type="button" id="start-button" class="btn">スタート</button>
        <button type="button" id="stop-button" class="btn btn-secondary" disabled>ストップ</button>
        <button type="button" id="lap-button" class="btn btn-secondary" disabled>ラップ</button>
        <!-- 「リセット」ボタンは script.js が作る -->
        <div id="reset-area"></div>
      </div>

      <p id="message" class="message" hidden aria-live="polite"></p>

      <ol id="lap-list" class="lap-list" hidden></ol>
    </main>

    <!-- common.js を先に読み、そのあとでゲーム本体を読む -->
    <script src="../../common/common.js"></script>
    <script src="script.js"></script>
  </body>
</html>
